# Cloud Build configuration for Expert Reports website
# Triggers automatic deployment to Cloud Run on push

substitutions:
  _TAG: ${SHORT_SHA:-latest}

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/courtpsychology-web:${_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/courtpsychology-web:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/courtpsychology-web'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'courtpsychology-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/courtpsychology-web:${_TAG}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/courtpsychology-web:latest'

options:
  logging: CLOUD_LOGGING_ONLY
